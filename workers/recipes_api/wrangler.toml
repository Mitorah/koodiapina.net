name = "koodiapina-net"
main = "worker.js"
compatibility_date = "2025-09-08"

# Route the worker to the same domain as the frontend
# This ensures Cloudflare Access cookies work properly
routes = [
  { pattern = "ruoka.koodiapina.net/api/*", zone_name = "koodiapina.net" }
]

[vars]
ALLOWED_ORIGIN = "https://ruoka.koodiapina.net"

[[d1_databases]]
binding = "DB"
database_name = "koodiapina_net_db"
database_id = "58fd57d4-0c4b-496b-89ff-98be9389c35c"

[observability.logs]
enabled = true

# Local development environment
[env.local]
[[env.local.d1_databases]]
binding = "DB"
database_name = "koodiapina_local"
database_id = "a59d0baa-b8b1-4ce6-ab73-c9d50f9048ab"
